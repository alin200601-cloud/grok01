<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>grok01</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0b0c'/><text x='16' y='22' text-anchor='middle' font-size='16' fill='%23d4a853'>g</text></svg>" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>grok01</h1>
            <p class="subtitle">xAI · grok-4.6</p>
          </div>
        </div>
      </header>

      <div id="banner" class="banner" hidden></div>

      <main id="thread" class="thread" aria-live="polite">
        <div id="empty" class="empty">
          <p class="empty-kicker">grok-4.6</p>
          <h2>Ask anything</h2>
          <p>Witty, maximally truthful. From xAI.</p>
        </div>
        <div id="messages" class="messages"></div>
      </main>

      <footer class="composer-wrap">
        <form id="composer" class="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Message grok01"
            autocomplete="off"
            enterkeyhint="send"
          ></textarea>
          <button id="send" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </button>
        </form>
        <p class="hint">Enter to send · Shift+Enter for a new line</p>
      </footer>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
